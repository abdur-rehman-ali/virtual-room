[project]
name = "virtual-room"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.7",
    "djangorestframework>=3.17.1",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0.0",
    "django-extensions>=4.1",
    "ipython>=9.15.0",
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
    "werkzeug>=3.1.8",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]
